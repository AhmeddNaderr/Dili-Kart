# Multiplayer rooms: one Durable Object per room code. Deployed as its own
# Worker (Pages can't host Durable Objects); the Pages API forwards room
# connections to it through the ROOMS binding in ../wrangler.toml.
name = "dili-rooms"
main = "src/index.ts"
compatibility_date = "2025-09-01"
# Only reachable through the binding, never on a public URL.
workers_dev = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
